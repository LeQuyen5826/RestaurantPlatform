services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: booking
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d booking"]
      interval: 3s
      retries: 20
  backend:
    build: ./backend
    env_file: ./backend/.env.example
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      VITE_BACKEND: http://backend:8000
    depends_on: [backend]
    ports: ["5173:5173"]
volumes:
  pgdata:
